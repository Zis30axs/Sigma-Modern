<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510">
<title>Modern NameTags · 紧凑名条与独立监测标记</title>
<desc>单行头顶名牌，默认没有头像和长血条。疑似玩家红名与警告 SVG 由 AntiCheat 控制，关闭 NameTags 后仍显示。</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08131e"/><stop offset="1" stop-color="#193242"/></linearGradient>
 <symbol id="warn" viewBox="0 0 24 24"><path d="M10.3 4a2 2 0 0 1 3.4 0l8 14a2 2 0 0 1-1.7 3H4a2 2 0 0 1-1.7-3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5m0 3v.2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
 <symbol id="heart" viewBox="0 0 24 24"><path d="M20.3 5.7a5.2 5.2 0 0 0-7.4 0L12 6.6l-.9-.9a5.2 5.2 0 0 0-7.4 7.4L12 21l8.3-7.9a5.2 5.2 0 0 0 0-7.4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
 <symbol id="shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 8v7m-3-3.5h6" stroke="currentColor" stroke-width="2"/></symbol>
 <symbol id="distance" viewBox="0 0 24 24"><path d="M3 12h18M7 8l-4 4 4 4m10-8 4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
 <symbol id="signal" viewBox="0 0 24 24"><path d="M4 19v-3m5 3v-6m6 6V9m5 10V5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
</defs>
<rect width="1120" height="510" rx="24" fill="url(#bg)"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
 <text x="48" y="43" fill="#86aec3" font-size="11" letter-spacing="3">SIGMA / MODERN</text>
 <text x="46" y="90" fill="#edf8ff" font-family="Georgia,serif" font-size="36">NameTags, simplified.</text>
 <text x="49" y="119" fill="#a2bfd1" font-size="14">跟随每位玩家头顶的轻量名条 · 默认无头像、无长血条</text>
 <text x="49" y="166" fill="#d9edf8" font-size="13">01 / NameTags 开启</text>
 <g transform="translate(160 187) scale(3)">
  <rect width="265" height="21" rx="4" fill="#415d6d"/>
  <rect x="1" y="1" width="263" height="19" rx="3" fill="#112431"/>
  <use href="#warn" x="6" y="6" width="9" height="9" color="#ff5555"/>
  <text x="18" y="14" fill="#ff5555" font-family="Georgia,serif" font-size="11">Nightfall</text>
  <g font-family="Georgia,serif" font-size="8.25">
   <use href="#heart" x="73" y="7" width="7" height="7" color="#9ae1b6"/><text x="82" y="14" fill="#9ae1b6">18</text>
   <use href="#shield" x="105" y="7" width="7" height="7" color="#f1cf86"/><text x="114" y="14" fill="#f1cf86">+4</text>
   <use href="#distance" x="140" y="7" width="7" height="7" color="#a2bfd1"/><text x="149" y="14" fill="#a2bfd1">24m</text>
   <use href="#signal" x="192" y="7" width="7" height="7" color="#a2bfd1"/><text x="201" y="14" fill="#a2bfd1">42ms</text>
  </g>
 </g>
 <g stroke="#577f93" fill="none"><path d="M252 249v18h-49"/><path d="M500 249v18h53"/><path d="M793 249v18h85"/></g>
 <g fill="#a2bfd1" font-size="12"><text x="160" y="289">监测命中：整名红色 + 警告 SVG</text><text x="478" y="289">生命 / 吸收生命</text><text x="774" y="289">距离 / 延迟</text></g>
 <path d="M48 318h1024" stroke="#7194aa" stroke-opacity=".2"/>
 <text x="49" y="355" fill="#d9edf8" font-size="13">02 / NameTags 关闭，AntiCheat 开启</text>
 <rect x="62" y="378" width="241" height="46" rx="2" fill="#000" fill-opacity=".25"/>
 <use href="#warn" x="76" y="387" width="25" height="25" color="#ff5555"/>
 <text x="111" y="411" font-family="monospace" font-size="28" fill="#ff5555">Nightfall</text>
 <text x="348" y="394" fill="#d9edf8" font-size="14">标记仍然生效</text>
 <text x="348" y="419" fill="#8dabbc" font-size="12">沿用原版名牌的遮挡；监测关闭、取消标记或 VL 回落后恢复原名颜色。</text>
 <text x="48" y="478" fill="#8dabbc" font-size="11">可独立开关：血量、距离、延迟、计分板、头像；长血条可选。盾牌表示吸收生命，不是盔甲装备。</text>
 <text x="1072" y="478" text-anchor="end" fill="#789aaf" font-size="11">布局示意 / 非游戏截图</text>
</g>
</svg>