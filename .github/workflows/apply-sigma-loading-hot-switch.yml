name: Apply Sigma Loading And Hot Switch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-sigma-loading-hot-switch.yml

permissions:
  contents: write

concurrency:
  group: sigma-loading-hot-switch-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Apply source-native Sigma migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match in {path}, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          loading = r'''package net.minecraft.client.gui.screens;

          import com.mentalfrostbyte.jello.util.client.render.LegacyUiScale;
          import com.mentalfrostbyte.jello.util.client.render.theme.ClientColors;
          import com.mojang.blaze3d.platform.NativeImage;
          import com.mojang.blaze3d.platform.Window;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.Optional;
          import java.util.function.Consumer;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import net.minecraft.client.renderer.RenderPipelines;
          import net.minecraft.client.renderer.texture.MipmapStrategy;
          import net.minecraft.client.renderer.texture.ReloadableTexture;
          import net.minecraft.client.renderer.texture.TextureContents;
          import net.minecraft.client.renderer.texture.TextureManager;
          import net.minecraft.client.resources.metadata.texture.TextureMetadataSection;
          import net.minecraft.resources.Identifier;
          import net.minecraft.server.packs.resources.ReloadInstance;
          import net.minecraft.server.packs.resources.ResourceManager;
          import net.minecraft.server.packs.resources.ResourceProvider;
          import net.minecraft.util.ARGB;
          import net.minecraft.util.Mth;
          import net.minecraft.util.Util;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.api.distmarker.OnlyIn;

          /** Minecraft's resource-reload overlay, presented with Sigma's original loading identity. */
          @OnlyIn(Dist.CLIENT)
          public class LoadingOverlay extends Overlay {
              /** Kept public for vanilla/source compatibility even though Sigma no longer renders it. */
              public static final Identifier MOJANG_STUDIOS_LOGO_LOCATION = Identifier.withDefaultNamespace("textures/gui/title/mojangstudios.png");
              private static final Identifier SIGMA_BACKGROUND = Identifier.withDefaultNamespace("textures/gui/sigma/back.png");
              private static final Identifier SIGMA_LOGO = Identifier.withDefaultNamespace("textures/gui/sigma/logo.png");
              private static final int SIGMA_BACKGROUND_WIDTH = 1280;
              private static final int SIGMA_BACKGROUND_HEIGHT = 720;
              private static final int SIGMA_LOGO_TEXTURE_WIDTH = 910;
              private static final int SIGMA_LOGO_TEXTURE_HEIGHT = 156;
              private static final int LIGHT = ClientColors.LIGHT_GREYISH_BLUE.getColor();
              private static final int DEEP_TEAL = ClientColors.DEEP_TEAL.getColor();
              private static final float SMOOTHING = 0.95F;
              public static final long FADE_OUT_TIME = 1000L;
              public static final long FADE_IN_TIME = 500L;

              private final Minecraft minecraft;
              private final ReloadInstance reload;
              private final Consumer<Optional<Throwable>> onFinish;
              private final boolean fadeIn;
              private float currentProgress;
              private long fadeOutStart = -1L;
              private long fadeInStart = -1L;

              public LoadingOverlay(final Minecraft minecraft, final ReloadInstance reload, final Consumer<Optional<Throwable>> onFinish, final boolean fadeIn) {
                  this.minecraft = minecraft;
                  this.reload = reload;
                  this.onFinish = onFinish;
                  this.fadeIn = fadeIn;
              }

              /**
               * The initial overlay is displayed while the normal resource reload is still running. Load Sigma's
               * bundled artwork explicitly from the classpath so it is available before that reload completes.
               */
              public static void registerTextures(final TextureManager textureManager) {
                  textureManager.registerAndLoad(MOJANG_STUDIOS_LOGO_LOCATION, new VanillaLogoTexture());
                  textureManager.registerAndLoad(SIGMA_BACKGROUND, new BundledLoadingTexture(SIGMA_BACKGROUND));
                  textureManager.registerAndLoad(SIGMA_LOGO, new BundledLoadingTexture(SIGMA_LOGO));
              }

              private static int replaceAlpha(final int color, final int alpha) {
                  return color & 0x00FFFFFF | Math.max(0, Math.min(255, alpha)) << 24;
              }

              @Override
              public void extractRenderState(final GuiGraphicsExtractor graphics, final int mouseX, final int mouseY, final float partialTick) {
                  int width = graphics.guiWidth();
                  int height = graphics.guiHeight();
                  long now = Util.getMillis();
                  if (this.fadeIn && this.fadeInStart == -1L) {
                      this.fadeInStart = now;
                  }

                  float fadeOutAnim = this.fadeOutStart > -1L ? (float)(now - this.fadeOutStart) / 1000.0F : -1.0F;
                  float fadeInAnim = this.fadeInStart > -1L ? (float)(now - this.fadeInStart) / 500.0F : -1.0F;
                  float overlayAlpha;

                  if (fadeOutAnim >= 1.0F) {
                      if (this.minecraft.gui.screen() != null) {
                          this.minecraft.gui.screen().extractRenderStateWithTooltipAndSubtitles(graphics, 0, 0, partialTick);
                      } else {
                          this.minecraft.gui.hud.extractDeferredSubtitles();
                      }
                      graphics.nextStratum();
                      overlayAlpha = 1.0F - Mth.clamp(fadeOutAnim - 1.0F, 0.0F, 1.0F);
                  } else if (this.fadeIn) {
                      if (this.minecraft.gui.screen() != null && fadeInAnim < 1.0F) {
                          this.minecraft.gui.screen().extractRenderStateWithTooltipAndSubtitles(graphics, mouseX, mouseY, partialTick);
                      } else {
                          this.minecraft.gui.hud.extractDeferredSubtitles();
                      }
                      graphics.nextStratum();
                      overlayAlpha = Mth.clamp(fadeInAnim, 0.15F, 1.0F);
                  } else {
                      ARGB.setVector4fFromARGB32(this.minecraft.gameRenderer.gameRenderState().guiRenderState.clearColorOverride, 0xFF000000);
                      overlayAlpha = 1.0F;
                  }

                  float actualProgress = this.reload.getActualProgress();
                  this.currentProgress = Mth.clamp(this.currentProgress * SMOOTHING + actualProgress * (1.0F - SMOOTHING), 0.0F, 1.0F);
                  this.extractSigmaLoading(graphics, width, height, overlayAlpha, fadeOutAnim < 1.0F);

                  if (fadeOutAnim >= 2.0F) {
                      this.minecraft.gui.setOverlay(null);
                  }
              }

              /** Port of Sigma 5's CustomLoadingScreen#xd without the historical direct-GL state. */
              private void extractSigmaLoading(
                  final GuiGraphicsExtractor graphics,
                  final int width,
                  final int height,
                  final float alpha,
                  final boolean drawProgress
              ) {
                  int alphaByte = Math.round(Mth.clamp(alpha, 0.0F, 1.0F) * 255.0F);
                  if (alphaByte <= 0) {
                      return;
                  }

                  int tint = ARGB.white(alphaByte / 255.0F);
                  graphics.blit(
                      RenderPipelines.GUI_TEXTURED,
                      SIGMA_BACKGROUND,
                      0,
                      0,
                      0.0F,
                      0.0F,
                      width,
                      height,
                      SIGMA_BACKGROUND_WIDTH,
                      SIGMA_BACKGROUND_HEIGHT,
                      SIGMA_BACKGROUND_WIDTH,
                      SIGMA_BACKGROUND_HEIGHT,
                      tint
                  );
                  graphics.fill(0, 0, width, height, ARGB.color(Math.round(alphaByte * 0.75F), 0, 0, 0));

                  int originalLogoWidth = LegacyUiScale.size(455);
                  int originalLogoHeight = LegacyUiScale.size(78);
                  float fit = Math.min(1.0F, Math.max(0.1F, (width - LegacyUiScale.size(20)) / (float)Math.max(1, originalLogoWidth)));
                  int logoWidth = Math.max(1, Math.round(originalLogoWidth * fit));
                  int logoHeight = Math.max(1, Math.round(originalLogoHeight * fit));
                  int logoX = (width - logoWidth) / 2;
                  int logoY = (height - logoHeight) / 2 - Math.round(LegacyUiScale.px(14.0F) * fit);

                  graphics.blit(
                      RenderPipelines.GUI_TEXTURED,
                      SIGMA_LOGO,
                      logoX,
                      logoY,
                      0.0F,
                      0.0F,
                      logoWidth,
                      logoHeight,
                      SIGMA_LOGO_TEXTURE_WIDTH,
                      SIGMA_LOGO_TEXTURE_HEIGHT,
                      SIGMA_LOGO_TEXTURE_WIDTH,
                      SIGMA_LOGO_TEXTURE_HEIGHT,
                      replaceAlpha(LIGHT, alphaByte)
                  );

                  if (!drawProgress) {
                      return;
                  }

                  float progress = Math.min(1.0F, this.currentProgress * 1.02F);
                  int barY = logoY + logoHeight + Math.round(LegacyUiScale.px(80.0F) * fit);
                  int barHeight = Math.max(3, Math.round(LegacyUiScale.size(20) * fit));
                  int border = Math.max(1, Math.round(LegacyUiScale.size(1) * fit));
                  int innerInset = Math.max(border + 1, Math.round(LegacyUiScale.size(2) * fit));
                  int radius = Math.max(1, Math.round(LegacyUiScale.size(10) * fit));

                  fillRoundedRect(
                      graphics,
                      logoX,
                      barY,
                      logoWidth,
                      barHeight,
                      radius,
                      replaceAlpha(LIGHT, Math.round(alphaByte * 0.30F))
                  );
                  fillRoundedRect(
                      graphics,
                      logoX + border,
                      barY + border,
                      Math.max(1, logoWidth - border * 2),
                      Math.max(1, barHeight - border * 2),
                      Math.max(1, radius - border),
                      replaceAlpha(DEEP_TEAL, alphaByte)
                  );

                  int trackWidth = Math.max(0, logoWidth - innerInset * 2);
                  int fillWidth = Math.round(trackWidth * progress);
                  if (fillWidth > 0) {
                      fillRoundedRect(
                          graphics,
                          logoX + innerInset,
                          barY + innerInset,
                          fillWidth,
                          Math.max(1, barHeight - innerInset * 2),
                          Math.max(1, radius - innerInset),
                          replaceAlpha(LIGHT, Math.round(alphaByte * 0.90F))
                      );
                  }
              }

              private static void fillRoundedRect(
                  final GuiGraphicsExtractor graphics,
                  final int x,
                  final int y,
                  final int width,
                  final int height,
                  final int requestedRadius,
                  final int color
              ) {
                  if (width <= 0 || height <= 0) {
                      return;
                  }

                  int radius = Math.max(0, Math.min(requestedRadius, Math.min(width, height) / 2));
                  if (radius == 0) {
                      graphics.fill(x, y, x + width, y + height, color);
                      return;
                  }

                  for (int row = 0; row < height; row++) {
                      int distance = -1;
                      if (row < radius) {
                          distance = radius - row - 1;
                      } else if (row >= height - radius) {
                          distance = row - (height - radius);
                      }

                      int inset = 0;
                      if (distance >= 0) {
                          double inside = Math.max(0.0, radius * (double)radius - distance * (double)distance);
                          inset = (int)Math.ceil(radius - Math.sqrt(inside));
                      }
                      graphics.fill(x + inset, y + row, x + width - inset, y + row + 1, color);
                  }
              }

              @Override
              public void tick() {
                  if (this.fadeOutStart == -1L && this.reload.isDone() && this.isReadyToFadeOut()) {
                      try {
                          this.reload.checkExceptions();
                          this.onFinish.accept(Optional.empty());
                      } catch (Throwable t) {
                          this.onFinish.accept(Optional.of(t));
                      }

                      this.fadeOutStart = Util.getMillis();
                      if (this.minecraft.gui.screen() != null) {
                          Window window = this.minecraft.getWindow();
                          this.minecraft.gui.screen().init(window.getGuiScaledWidth(), window.getGuiScaledHeight());
                      }
                  }
              }

              private boolean isReadyToFadeOut() {
                  return !this.fadeIn || this.fadeInStart > -1L && Util.getMillis() - this.fadeInStart >= 1000L;
              }

              @OnlyIn(Dist.CLIENT)
              private static final class VanillaLogoTexture extends ReloadableTexture {
                  private VanillaLogoTexture() {
                      super(MOJANG_STUDIOS_LOGO_LOCATION);
                  }

                  @Override
                  public TextureContents loadContents(final ResourceManager resourceManager) throws IOException {
                      ResourceProvider vanillaProvider = Minecraft.getInstance().getVanillaPackResources().asProvider();
                      try (InputStream resource = vanillaProvider.open(MOJANG_STUDIOS_LOGO_LOCATION)) {
                          return textureContents(resource);
                      }
                  }
              }

              @OnlyIn(Dist.CLIENT)
              private static final class BundledLoadingTexture extends ReloadableTexture {
                  private final Identifier location;

                  private BundledLoadingTexture(final Identifier location) {
                      super(location);
                      this.location = location;
                  }

                  @Override
                  public TextureContents loadContents(final ResourceManager resourceManager) throws IOException {
                      String classpath = "assets/" + this.location.getNamespace() + "/" + this.location.getPath();
                      InputStream resource = LoadingOverlay.class.getClassLoader().getResourceAsStream(classpath);
                      if (resource == null) {
                          throw new IOException("Missing bundled Sigma loading resource: " + classpath);
                      }

                      try (resource) {
                          return textureContents(resource);
                      }
                  }
              }

              private static TextureContents textureContents(final InputStream resource) throws IOException {
                  return new TextureContents(
                      NativeImage.read(resource),
                      new TextureMetadataSection(true, true, MipmapStrategy.MEAN, 0.0F)
                  );
              }
          }
          '''
          # Strip the heredoc indentation while preserving Java's own four-space style.
          lines = loading.splitlines()
          normalized = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path("src/main/java/net/minecraft/client/gui/screens/LoadingOverlay.java").write_text(normalized, encoding="utf-8")

          mc = "src/main/java/net/minecraft/client/Minecraft.java"
          replace_once(mc, "import com.mojang.realmsclient.RealmsMainScreen;\n", "import com.mojang.realmsclient.RealmsAvailability;\nimport com.mojang.realmsclient.RealmsMainScreen;\n", "Minecraft RealmsAvailability import")
          for old, new, label in [
              ("private final CompletableFuture<@Nullable ProfileResult> profileFuture;", "private CompletableFuture<@Nullable ProfileResult> profileFuture;", "mutable profile future"),
              ("private final User user;", "private User user;", "mutable user"),
              ("private final UserApiService userApiService;", "private UserApiService userApiService;", "mutable user api"),
              ("private final CompletableFuture<UserProperties> userPropertiesFuture;", "private CompletableFuture<UserProperties> userPropertiesFuture;", "mutable user properties"),
              ("private final PlayerSocialManager playerSocialManager;", "private PlayerSocialManager playerSocialManager;", "mutable social manager"),
              ("private final RemoteFriendListUpdateHandler remoteFriendListUpdateHandler;", "private RemoteFriendListUpdateHandler remoteFriendListUpdateHandler;", "mutable friend updater"),
              ("private final ClientTelemetryManager telemetryManager;", "private ClientTelemetryManager telemetryManager;", "mutable telemetry"),
              ("private final ProfileKeyPairManager profileKeyPairManager;", "private ProfileKeyPairManager profileKeyPairManager;", "mutable profile keys"),
              ("private final RealmsDataFetcher realmsDataFetcher;", "private RealmsDataFetcher realmsDataFetcher;", "mutable realms fetcher"),
          ]:
              replace_once(mc, old, new, label)

          replace_once(
              mc,
              "    private final Services services;\n",
              "    private final YggdrasilAuthenticationService authenticationService;\n    private final Services services;\n    private boolean sigmaOfflineUser;\n",
              "authentication service field"
          )

          old_auth = '''        YggdrasilAuthenticationService authenticationService = this.offlineDeveloperMode
              ? YggdrasilAuthenticationService.createOffline(this.proxy)
              : new YggdrasilAuthenticationService(this.proxy);
          this.services = Services.create(authenticationService, this.gameDirectory);
          this.user = gameConfig.user.user;
          this.profileFuture = this.offlineDeveloperMode
              ? CompletableFuture.completedFuture(null)
              : CompletableFuture.supplyAsync(() -> this.services.sessionService().fetchProfile(this.user.getProfileId(), true), Util.nonCriticalIoPool());
          this.userApiService = createUserApiService(authenticationService, gameConfig);
          this.userPropertiesFuture = CompletableFuture.supplyAsync(() -> {
              try {
                  return this.userApiService.fetchProperties();
              } catch (AuthenticationException e) {
                  LOGGER.error("Failed to fetch user properties", e);
                  return UserApiService.OFFLINE_PROPERTIES;
              }
          }, Util.nonCriticalIoPool());'''
          new_auth = '''        this.authenticationService = this.offlineDeveloperMode
              ? YggdrasilAuthenticationService.createOffline(this.proxy)
              : new YggdrasilAuthenticationService(this.proxy);
          this.services = Services.create(this.authenticationService, this.gameDirectory);
          this.user = gameConfig.user.user;
          this.sigmaOfflineUser = "0".equals(this.user.getAccessToken());
          boolean offlineUserServices = this.offlineDeveloperMode || this.sigmaOfflineUser;
          this.profileFuture = offlineUserServices
              ? CompletableFuture.completedFuture(null)
              : CompletableFuture.supplyAsync(() -> this.services.sessionService().fetchProfile(this.user.getProfileId(), true), Util.nonCriticalIoPool());
          this.userApiService = createUserApiService(this.authenticationService, this.user, offlineUserServices);
          this.userPropertiesFuture = offlineUserServices
              ? CompletableFuture.completedFuture(UserApiService.OFFLINE_PROPERTIES)
              : CompletableFuture.supplyAsync(() -> {
                  try {
                      return this.userApiService.fetchProperties();
                  } catch (AuthenticationException e) {
                      LOGGER.error("Failed to fetch user properties", e);
                      return UserApiService.OFFLINE_PROPERTIES;
                  }
              }, Util.nonCriticalIoPool());'''
          replace_once(mc, old_auth, new_auth, "Minecraft constructor identity services")
          replace_once(mc, "FriendsService friendsService = authenticationService.createFriendsService(this.user.getAccessToken());", "FriendsService friendsService = this.authenticationService.createFriendsService(this.user.getAccessToken());", "Minecraft friends service")
          replace_once(mc, "this.profileKeyPairManager = this.offlineDeveloperMode\n            ? ProfileKeyPairManager.EMPTY_KEY_MANAGER", "this.profileKeyPairManager = offlineUserServices\n            ? ProfileKeyPairManager.EMPTY_KEY_MANAGER", "Minecraft startup profile keys")

          old_api = '''    private static UserApiService createUserApiService(final YggdrasilAuthenticationService authService, final GameConfig config) {
              return config.game.offlineDeveloperMode ? UserApiService.OFFLINE : authService.createUserApiService(config.user.user.getAccessToken());
          }'''
          new_api = '''    private static UserApiService createUserApiService(
              final YggdrasilAuthenticationService authService,
              final User user,
              final boolean offline
          ) {
              return offline ? UserApiService.OFFLINE : authService.createUserApiService(user.getAccessToken());
          }'''
          replace_once(mc, old_api, new_api, "Minecraft user api factory")

          old_user_getter = '''    public User getUser() {
              return this.user;
          }

          public @Nullable ProfileResult getProfileResult() {'''
          new_user_getter = '''    public User getUser() {
              return this.user;
          }

          /** True for a Sigma offline identity even when the client itself was not launched in developer-offline mode. */
          public boolean isSigmaOfflineUser() {
              return this.sigmaOfflineUser;
          }

          /**
           * Hot-switch the title-screen identity and rebuild every account-bound service that survives past startup.
           * The switch is intentionally rejected while a world, server connection or integrated server is active.
           */
          public CompletableFuture<Boolean> sigmaSwitchUser(final User newUser, final boolean offlineAccount) {
              if (!this.sigmaCanSwitchUser()) {
                  return CompletableFuture.completedFuture(false);
              }

              CompletableFuture<Boolean> result = new CompletableFuture<>();
              Util.nonCriticalIoPool().execute(() -> {
                  try {
                      boolean offlineServices = this.offlineDeveloperMode || offlineAccount;
                      UserApiService newUserApiService = createUserApiService(this.authenticationService, newUser, offlineServices);
                      UserProperties newProperties = this.sigmaFetchUserProperties(newUserApiService, offlineServices);
                      FriendsService newFriendsService = this.authenticationService.createFriendsService(newUser.getAccessToken());
                      this.execute(() -> {
                          try {
                              result.complete(
                                  this.sigmaApplyUserSwitch(newUser, offlineAccount, newUserApiService, newProperties, newFriendsService)
                              );
                          } catch (Throwable failure) {
                              result.completeExceptionally(failure);
                          }
                      });
                  } catch (Throwable failure) {
                      result.completeExceptionally(failure);
                  }
              });
              return result;
          }

          private UserProperties sigmaFetchUserProperties(final UserApiService service, final boolean offlineServices) {
              if (offlineServices) {
                  return UserApiService.OFFLINE_PROPERTIES;
              }

              try {
                  return service.fetchProperties();
              } catch (AuthenticationException failure) {
                  LOGGER.warn("Failed to refresh user properties while hot-switching Sigma account", failure);
                  return UserApiService.OFFLINE_PROPERTIES;
              }
          }

          private boolean sigmaApplyUserSwitch(
              final User newUser,
              final boolean offlineAccount,
              final UserApiService newUserApiService,
              final UserProperties newProperties,
              final FriendsService newFriendsService
          ) {
              if (!this.sigmaCanSwitchUser()) {
                  return false;
              }

              boolean offlineServices = this.offlineDeveloperMode || offlineAccount;

              if (this.remoteFriendListUpdateHandler != null) {
                  this.remoteFriendListUpdateHandler.close();
              }
              if (this.telemetryManager != null) {
                  this.telemetryManager.close();
              }

              this.user = newUser;
              this.sigmaOfflineUser = offlineAccount;
              this.userApiService = newUserApiService;
              this.userPropertiesFuture = CompletableFuture.completedFuture(newProperties);
              this.profileFuture = offlineServices
                  ? CompletableFuture.completedFuture(null)
                  : CompletableFuture.supplyAsync(
                      () -> this.services.sessionService().fetchProfile(newUser.getProfileId(), true),
                      Util.nonCriticalIoPool()
                  );

              this.remoteFriendListUpdateHandler = new RemoteFriendListUpdateHandler(newFriendsService, this);
              this.playerSocialManager = new PlayerSocialManager(
                  this, this.userApiService, newFriendsService, this.remoteFriendListUpdateHandler
              );
              if (this.playerSocialManager.isFriendListEnabled()) {
                  this.remoteFriendListUpdateHandler.start();
              }

              this.telemetryManager = new ClientTelemetryManager(this, this.userApiService, this.user);
              this.profileKeyPairManager = offlineServices
                  ? ProfileKeyPairManager.EMPTY_KEY_MANAGER
                  : ProfileKeyPairManager.create(this.userApiService, this.user, this.gameDirectory.toPath());
              this.reportingContext = ReportingContext.create(ReportEnvironment.local(), this.userApiService);

              RealmsAvailability.reset();
              this.realmsDataFetcher = new RealmsDataFetcher(RealmsClient.getOrCreate(this));
              this.updateTitle();
              LOGGER.info("Sigma hot-switched user to {} ({})", this.user.getName(), this.user.getProfileId());
              return true;
          }

          private boolean sigmaCanSwitchUser() {
              return this.level == null
                  && this.player == null
                  && this.gameMode == null
                  && this.pendingConnection == null
                  && this.singleplayerServer == null;
          }

          public @Nullable ProfileResult getProfileResult() {'''
          replace_once(mc, old_user_getter, new_user_getter, "Minecraft hot user switch")

          dps = "src/main/java/net/minecraft/client/resources/server/DownloadedPackSource.java"
          replace_once(
              dps,
              '''            private Map<String, String> createDownloadHeaders() {
                  WorldVersion version = SharedConstants.getCurrentVersion();
                  return Map.of(
                      "X-Minecraft-Username",
                      user.getName(),
                      "X-Minecraft-UUID",
                      UndashedUuid.toString(user.getProfileId()),''',
              '''            private Map<String, String> createDownloadHeaders() {
                  WorldVersion version = SharedConstants.getCurrentVersion();
                  User currentUser = DownloadedPackSource.this.minecraft.getUser();
                  return Map.of(
                      "X-Minecraft-Username",
