                              this.switchInProgress = false;
                              if (failure != null) {
                                  Client.logger.error("Sigma hot account switch failed", failure);
                                  this.status = "Login failed: " + concise(failure);
                              } else if (!switched) {
                                  this.status = "Login prepared, but hot switching is not safe until returning to the title screen.";
                              } else {
