                      UndashedUuid.toString(currentUser.getProfileId()),''',
              "dynamic server-pack identity"
          )

          realms = "src/main/java/com/mojang/realmsclient/client/RealmsClient.java"
          old_realms_get = '''        RealmsClient realmsClient = realmsClientInstance;
              if (realmsClient != null) {
                  return realmsClient;
              }

              synchronized (RealmsClient.class) {
                  RealmsClient rc = realmsClientInstance;
