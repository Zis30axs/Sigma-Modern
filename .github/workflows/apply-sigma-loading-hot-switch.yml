          /** Refresh an account for immediate use and persist it as the selected identity after success. */
          public LaunchIdentity resolveForUse(final String id) throws Exception {
              AccountEntry account;
              synchronized (this) {
                  account = this.find(id);
              }
              if (account == null) {
                  throw new IllegalArgumentException("Unknown Sigma account: " + id);
              }

              LaunchIdentity identity = this.resolveIdentity(account);
              synchronized (this) {
                  if (!this.accounts.contains(account)) {
                      throw new IllegalStateException("Account was removed while it was being refreshed");
                  }
                  this.selectedId = account.id;
                  account.lastUsed = System.currentTimeMillis();
                  account.useCount++;
                  this.save();
              }
              return identity;
          }

