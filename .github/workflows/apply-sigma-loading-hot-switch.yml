name: Apply Sigma Loading And Hot Switch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-sigma-loading-hot-switch.yml

permissions:
  contents: write

concurrency:
  group: sigma-loading-hot-switch-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Fix staging matcher
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_sigma_loading_hot_switch.py')
          source = path.read_text(encoding='utf-8')
          pairs = [
              (
                  '    "    private void useLauncherAccount() {\\n        this.accounts.useLauncherIdentity();\\n",',
                  '    "private void useLauncherAccount() {\\n        this.accounts.useLauncherIdentity();\\n",'
              ),
              (
                  '    "    private void useLauncherAccount() {\\n        if (this.switchInProgress) {\\n            return;\\n        }\\n        this.accounts.useLauncherIdentity();\\n",',
                  '    "private void useLauncherAccount() {\\n        if (this.switchInProgress) {\\n            return;\\n        }\\n        this.accounts.useLauncherIdentity();\\n",'
              ),
          ]
          for old, new in pairs:
              if source.count(old) != 1:
                  raise SystemExit(f'staging matcher patch expected one occurrence, got {source.count(old)}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply source-native Sigma migration
        run: python3 .github/scripts/apply_sigma_loading_hot_switch.py

      - name: Normalize generated loading source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/main/java/net/minecraft/client/gui/screens/LoadingOverlay.java')
          source = path.read_text(encoding='utf-8')
          if source.startswith('\\\n'):
              source = source[2:]
          path.write_text(source, encoding='utf-8')
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Build patched client
        run: mvn -B -DskipTests package dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/dependency

      - name: Commit validated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-sigma-loading-hot-switch.yml .github/scripts/apply_sigma_loading_hot_switch.py
          git add \
            src/main/java/net/minecraft/client/gui/screens/LoadingOverlay.java \
            src/main/java/net/minecraft/client/Minecraft.java \
            src/main/java/net/minecraft/client/resources/server/DownloadedPackSource.java \
            src/main/java/com/mojang/realmsclient/client/RealmsClient.java \
            src/main/java/com/mojang/realmsclient/RealmsAvailability.java \
            src/main/java/com/mentalfrostbyte/jello/account/SigmaAccountManager.java \
            src/main/java/com/mentalfrostbyte/jello/gui/account/SigmaAccountScreen.java
          git diff --cached --check
          git commit -m "Restore Sigma loading and hot account switching"
          git push origin HEAD:main
